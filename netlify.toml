# Generated by build.py on 2026-11-06 - edit build.py, not this file.
# PRELAUNCH = False

[build]
  publish = "."
  # The site is pre-built locally (python3 build.py) and dist/ is committed.
  command = ""

# ---- redirects ---------------------------------------------------------
# www -> apex (active once both domains point to this site)
[[redirects]]
  from = "https://www.paxis-hk.com/*"
  to = "https://paxis-hk.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/quote/#contact"
  status = 301

# do not serve the config file itself from the publish folder
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# ---- headers -----------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests"
  # No includeSubDomains: mail.paxis-hk.com is a CNAME to a third-party mail host
  # whose certificate does not match the name. No preload.
  Strict-Transport-Security = "max-age=31536000"
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "DENY"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=(), browsing-topics=()"
  Cross-Origin-Opener-Policy = "same-origin"
  Cross-Origin-Resource-Policy = "same-origin"
  X-Permitted-Cross-Domain-Policies = "none"
  # X-Robots-Tag = "noindex, nofollow"   # pre-launch only (PRELAUNCH flag in build.py)

# Hashed file names under /assets/ never change content -> cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
  Content-Type = "application/manifest+json; charset=utf-8"
  Cache-Control = "public, max-age=86400"

# Self-unregistering worker that retires the previous website's service worker: always revalidated.
[[headers]]
  for = "/sw.js"
  [headers.values]
  Cache-Control = "no-cache, max-age=0"
  Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/favicon*"
  [headers.values]
  Cache-Control = "public, max-age=86400"
